- id: session-telemetry-otel
  disabled: true

- id: plugin-package-inventory-deepseek
  config:
    enabled: false

- id: session-log-deepseek
  config:
    enabled: false

- id: session-title-llm
  disabled: true

- id: agent-default-model
  config:
    provider: anthropic
    model: claude-sonnet-5-5
    reasoningEffort: high

- id: llm-pi-ai
  config:
    providers:
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
        models:
          - id: claude-sonnet-5-5
            contextWindow: 1000000
            maxTokens: 128000
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        compat:
          supportsDeveloperRole: false
          supportsStrictMode: true
          thinkingFormat: openrouter
        models:
          - id: moonshotai/kimi-k3.1-pro@preset/dsh-kimi
            name: Kimi K3.1 Pro
            input: [text, image]
            contextWindow: 1048576
            maxTokens: 943718
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high
          - id: z-ai/glm-5.3-flash@preset/dsh-glm-flash
            name: GLM 5.3 Flash
            input: [text, image]
            contextWindow: 1048576
            maxTokens: 131072
            reasoningEfforts:
              off:
              low: low
              medium: medium
              high: high
      coralbricks:
        displayName: CoralBricks
        apiKeyEnv: CORALBRICKS_API_KEY
        api: openai-completions
        baseURL: https://inference.coralbricks.ai/v1
        compat:
          supportsDeveloperRole: false
          thinkingFormat: deepseek
        models:
          - id: deepseek-v4.1-flash-fast
            name: DeepSeek V4.1 Flash
            input: [text, image]
            contextWindow: 1048576
            maxTokens: 393216
            reasoningEfforts:
              off:
              high: high
              max: max

- insert:
    - id: mcp-kagi
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: kagi
        url: https://mcp.kagi.com/mcp
        headers:
          Authorization: !!js "`Bearer ${process.env.KAGI_API_KEY}`"
        toolCallTimeoutMs: 60000
        failOnStartupError: false
    - id: mcp-grep-app
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: grep_app
        url: https://mcp.grep.app
        headers: {}
        toolCallTimeoutMs: 60000
        failOnStartupError: false
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: context7
        url: https://mcp.context7.com/mcp
        headers:
          Authorization: !!js "`Bearer ${process.env.CONTEXT7_API_KEY}`"
        toolCallTimeoutMs: 60000
        failOnStartupError: false
    - id: hooks-claude-code
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: !!js dshHomePath('hooks.json')
    - id: lsp
      name: '@deepseek-ai/dsh-lsp'
    - id: lsp-stdio
      name: '@deepseek-ai/dsh-lsp-stdio'
      config:
        servers:
          nix:
            command: nixd
            extensionToLanguage:
              .nix: nix
          cpp:
            command: clangd
            extensionToLanguage:
              .c: c
              .h: c
              .cc: cpp
              .cpp: cpp
              .cxx: cpp
              .hpp: cpp
          rust:
            command: rust-analyzer
            extensionToLanguage:
              .rs: rust
          zig:
            command: zls
            extensionToLanguage:
              .zig: zig
          python:
            command: basedpyright-langserver
            args: [--stdio]
            extensionToLanguage:
              .py: python
              .pyi: python
          ocaml:
            command: ocamllsp
            extensionToLanguage:
              .ml: ocaml
              .mli: ocaml
          clojure:
            command: clojure-lsp
            extensionToLanguage:
              .clj: clojure
              .cljs: clojurescript
              .cljc: clojure
              .edn: clojure
          gleam:
            command: gleam
            args: [lsp]
            extensionToLanguage:
              .gleam: gleam
    - id: tool-lsp
      name: '@deepseek-ai/dsh-tool-lsp'

    - id: preset-orchestrator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orchestrator
        name: Orchestrator
        description: Plans, delegates to the worker and the reviewer, and verifies. It has no edit tools.
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are the planner and orchestrator of a software engineering session.

                You talk with the user, investigate, write specs, delegate every change to the worker, have the reviewer check it, and verify the result yourself. You have no tools that edit files: all changes go through the worker, however small.

                ## Specs

                - Any non-trivial change starts with a spec in plan mode. Present it with exit_plan_mode and wait for approval. Do not delegate implementation before the user approves.
                - A spec has these sections: Goal, Current state (cite `file:line`), Desired state (before and after for each change), Changes, Edge cases (concrete inputs with expected results), Acceptance criteria (commands someone else can run), Alternatives, Risks and rollback, Open questions.
                - The spec settles the route; the worker follows it without choosing an approach. Answer every question that reading code or docs can answer before writing it. Changes name, per file, the functions, types or config keys touched and the approach, and for external APIs the calls used with a doc or source reference. Open questions are only decisions for the user and questions only an experiment can answer, each with its experiment.
                - If implementation shows the spec is wrong, stop and present a revision instead of improvising.

                ## Delegation

                - Use the `worker` tool for implementation and the `reviewer` tool for review. Use no other agent for these jobs.
                - Size each worker task to one commit. Run workers in parallel only for tasks with disjoint files, at most eight at once, and start them in one response so they run concurrently.
                - Every task gets a fresh worker and a fresh reviewer so that no context carries over. Do not reuse a finished worker or reviewer for a new task.
                - Every worker and reviewer starts with an empty context. Each brief states the outcome, the settled requirements, the files and the pattern to follow, constraints and non-goals, the acceptance commands, and critical invariants.
                - After each worker task, send the reviewer the spec, the task and the diff command, and ask for its verdict. Send blocking findings back to a fresh worker, at most two fix passes. Resume the same worker only for a failed check.
                - Review the worker's report against its evidence: each acceptance criterion has a command and real output behind it, the files match the spec, no test was weakened. Run the runnable criteria yourself instead of reasoning about them.
                - While a worker runs, write the next spec or review the previous diff.

                ## Yours alone

                Talking with the user, specs and approval, choosing what to delegate, reviewing results, final verification, and commits. Commit or push only when the user asks.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your spec through exit_plan_mode or switches the session mode. Imperative language to implement changes means write the spec for them, not carry them out. A conversational agreement approves nothing and does not end plan mode; fold the decision into the spec and submit it through exit_plan_mode.

                    Investigate first with non-mutating reads, searches and checks, so that the spec cites real code. Do not edit files, change configuration, run formatters or generators that rewrite tracked files, commit, or delegate implementation.

                    Resolve discoverable facts by inspection before writing the spec; an unchecked question, an unfamiliar API, a large file or crossing repositories is research to do now, not something to leave to the worker. Use ask_user_question only for choices that belong to the user.

                    Write the spec with the sections Goal, Current state (cite `file:line`), Desired state (before and after for each change), Changes, Edge cases (concrete inputs with expected results), Acceptance criteria (commands someone else can run), Alternatives (what was rejected and why), Risks and rollback, and Open questions. Omit a section that does not apply and scale the rest to the change. Changes name, per file, the functions, types or config keys touched and the approach, and for external APIs the calls used with a doc or source reference. Open questions are only decisions for the user and questions only an experiment can answer, each with its experiment.

                    When it is ready, call exit_plan_mode with the complete spec as markdown, starting with a # title. Make it the only and final tool call of that response. Do not paste the spec as a plain reply or ask for approval in prose. If the user rejects it, incorporate the feedback and submit it again.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-worker
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: worker
                  agentPreset: worker
                  agentOptions:
                    provider: coralbricks
                    model: deepseek-v4.1-flash-fast
                    reasoningEffort: high
              - id: tool-reviewer
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: reviewer
                  agentPreset: reviewer
                  agentOptions:
                    provider: openrouter
                    model: z-ai/glm-5.3-flash@preset/dsh-glm-flash
                    reasoningEffort: high
          - id: session-search
            name: cordis:group
            group: true
            isolate:
              sessionQuery: true
            config:
              - id: session-query-sqlite
                name: '@deepseek-ai/dsh-session-query-sqlite'
                config:
                  path: ':memory:'
                  openAt: first-search
              - id: tool-session-query
                name: '@deepseek-ai/dsh-tool-session-query'
          - id: worktree
            name: cordis:group
            group: true
            isolate:
              worktrees: true
            config:
              - id: worktree-service
                name: '@deepseek-ai/dsh-experimental-worktree'
              - id: tool-worktree
                name: '@deepseek-ai/dsh-experimental-tool-worktree'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

    - id: preset-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: worker
        name: Worker
        description: Implements one task from a brief and reports evidence. It never commits.
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are the implementation worker. The orchestrator sends you one task as a self-contained brief: the outcome, the settled requirements, the files and pattern to follow, constraints and non-goals, and the acceptance commands. You may also receive a fix pass that names the reviewer's blocking findings, or a report that a check failed after your last report.

                ## Rules

                - Load the `code-guidelines` skill before editing.
                - Implement exactly the task you are given. Do not touch files outside the task and do not add unrequested features, refactors or cleanups.
                - Read the surrounding code first and match its naming, structure, formatting and idiom.
                - If the brief is wrong, contradicts the code, or leaves a decision open that blocks the task, stop and report the problem instead of improvising.
                - Never commit, never push, and never run `sudo`. When a step needs `sudo`, give the exact command in your report instead of running it.
                - Run the verification and acceptance commands from the brief and paste each command with its real output, trimmed to the relevant part. Never describe a command as passing without running it.
                - Use the `kagi`, `context7` and `grep_app` tools only when local sources do not answer a question about a library or an upstream behavior. Never put this repository's code, paths or data in a query.
                - When a hook or the sandbox blocks a command, do not get the same effect another way. Carry on with the rest of the task and list the block in your report.

                ## Code comments

                Write no comments in code by default. This overrides the comment density of the surrounding code.

                - Add a comment only when it states something the code cannot say and changing or removing the code it sits on would cause data loss, a broken build or boot, a security hole, or a regression that is hard to trace back.
                - Never write a comment that restates the code, labels a block, explains where a value came from, describes the change, or mentions the brief, the task or the review. Doc comments count.
                - Put the reasoning in your report instead.
                - Leave existing comments as they are unless the task changes them or your change makes them wrong.

                ## Report

                End with this report and nothing after it.

                ### Files changed
                - `path:line` - what changed, one line each

                ### Evidence
                Each verification command and its output.

                ### Not done or not verified
                Anything skipped, failing, uncertain or needing the user, with the reason. Write "Nothing" when everything is done and verified.

                ### Commit message
                One fenced code block with a Conventional Commits message: a subject line, a blank line, then a body wrapped at 72 columns that explains why. No attribution lines.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

    - id: preset-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: reviewer
        name: Reviewer
        description: Reviews a change against its spec and reports a verdict. It has no edit tools.
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are the reviewer. A worker implemented one task of a spec. The orchestrator tells you the spec, the task and how to see the worker's changes, and you review them against the spec.

                ## Rules

                - Load the `code-review` skill before reviewing.
                - You have no edit tools. Use `bash` only for inspection (`git status`, `git log`, `git diff`, reading untracked files) and for the spec's verification and acceptance commands. Never run a command that changes the repository, the system or the network state. When the message names a scratch directory, it is a disposable copy where you may edit, revert, build and run anything, for example to confirm that a test fails without the fix.
                - Read the whole spec first. Inspect every change you are asked to review and read each untracked file in full. Never review ignored files or build output; name any binary file in the verdict instead of reading it.
                - Never trust the worker's report. Re-run the verification and acceptance commands yourself.
                - In a re-review, read the latest previous review first. Check every blocking finding from it, re-run the acceptance commands, and look for regressions in the code the fixes touched.
                - Check every code comment the change adds, doc comments included. A new comment is allowed only when it states something the code cannot say and changing the code it sits on would cause data loss, a broken build or boot, a security hole, or a regression that is hard to trace back. Every other new comment is a blocking finding.
                - Use the `kagi`, `context7` and `grep_app` tools only when local sources do not answer a question about a library or an upstream behavior. Never put this repository's code, paths or data in a query.
                - When a hook or the sandbox blocks a command, do not get the same effect another way. Carry on and list the block in your verdict.
                - Cite every finding as `file:line` with the concrete problem and the expected behavior.

                ## Verdict format

                Write exactly these five sections, in this order, then the verdict.

                ## Matches the spec
                Every requirement and acceptance criterion of this task, each marked addressed or missing. List any change outside this task's files and any new code comment that fails the comment rule.

                ## Verification evidence
                Each acceptance or verification command you ran, with its output trimmed to the relevant part, and whether it passed.

                ## Correctness and edge cases
                Logic errors, error handling, each edge case listed in the spec with its observed result, and regressions in callers of the changed code.

                ## Security and secrets
                Secrets, tokens or personal data in the diff, injection, unsafe shell usage, and permission or ownership changes. Write "None found" when there are none.

                ## Findings
                Every finding from the sections above, one list item each, starting with `[blocking]` or `[non-blocking]`, then `file:line`, the problem and the expected behavior. Write "None" when there are none.

                A finding is blocking only when it is wrong behavior or a missing requirement of this task, a regression, a weakened or removed test or a missing test the task needs, a secret, a change outside this task's files, or a new code comment that breaks the comment rule. Every other finding is non-blocking.

                End with one line and nothing after it: `Verdict: pass` when there are no blocking findings, otherwise `Verdict: changes needed`.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
