# Prefix is C-a. C-a C-a flips to the last window; C-a a sends a literal C-a (line start in fish).

# Terminal ------------------------------------------------------------------------------------

set -g default-terminal tmux-256color
set -s terminal-features 'foot*:RGB:clipboard:ccolour:cstyle:focus:title:strikethrough:usstyle:overline:sync:hyperlinks:extkeys'
set -as terminal-features 'xterm*:RGB:clipboard:ccolour:cstyle:focus:title'
set -s escape-time 10
set -s extended-keys on
set -g focus-events on
set -g default-shell /run/current-system/sw/bin/fish
set -g set-clipboard external
set -s copy-command 'wl-copy --type text/plain'
set -g set-titles on
set -g set-titles-string '#S · #W'
set -g update-environment 'DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WAYLAND_DISPLAY NIRI_SOCKET SWAYSOCK XAUTHORITY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS'

# Behaviour -----------------------------------------------------------------------------------

set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
setw -g mode-keys vi
set -g status-keys emacs
set -g detach-on-destroy off
setw -g aggressive-resize on
set -g display-time 1500
set -g repeat-time 400

# Alerts: a bell (agents ring it when they finish or need input) marks the window, in any session.
setw -g monitor-bell on
setw -g monitor-activity off
set -g bell-action any
set -g visual-bell off

# Keys ----------------------------------------------------------------------------------------

unbind C-b
set -g prefix C-a
bind a send-prefix
bind C-a last-window

bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux configuration reloaded'

# Panes: h/j/k/l move and H/J/K/L resize; both repeat without the prefix for a moment.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind x kill-pane
bind b break-pane
# z zooms (default), ; last pane (default), Space cycles layouts (default).

# Windows: 1-9 jump, n/p step (repeatable), < > reorder, , renames (default).
bind c new-window -c '#{pane_current_path}'
bind -r n next-window
bind -r p previous-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind u next-window -a
bind w choose-tree -Zw -f '#{?#{m:_scratch_*,#{session_name}},0,1}'

# Sessions: one per project. o picks or creates one, Tab flips to the last, S shows the tree.
bind o display-popup -E -w 60% -h 50% ~/.config/tmux/bin/tmux-sessionizer
bind Tab switch-client -l
bind S choose-tree -Zs -f '#{?#{m:_scratch_*,#{session_name}},0,1}'
bind X confirm-before -p 'kill session #S? (y/n)' kill-session

# Tools
bind g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit
bind A new-window -c '#{pane_current_path}' -n claude claude
# ` toggles a floating shell that keeps running, one per session.
bind ` if -F '#{m:_scratch_*,#{session_name}}' 'detach-client' \
    "display-popup -E -w 85% -h 80% -d '#{pane_current_path}' 'tmux new-session -A -s _scratch_#{session_name} \\; set status off'"

# Copy mode: C-a [ or Escape enters, v / C-v select, y copies to the clipboard, ] pastes.
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind ] paste-buffer -p

# Status line ---------------------------------------------------------------------------------

set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-left ' #S '
# Other sessions with an alert, then the prefix / copy / zoom indicators and the clock.
set -g status-right '#[fg=#{@theme-red},bold]#{S:#{?#{&&:#{session_alerts},#{!=:#{session_name},#{client_session}}}, #{session_name}! ,}}#[default]#{?client_prefix,#[fg=#{@theme-blue}#,bold] PREFIX #[default],}#{?pane_in_mode, COPY ,}#{?window_zoomed_flag, ZOOM ,} %H:%M '
setw -g window-status-format ' #I:#W#{?window_bell_flag, !,} '
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, +,} '

set -g @theme-bg '#262626'
set -g @theme-bg-alt '#333333'
set -g @theme-selection '#404040'
set -g @theme-border '#4d4d4d'
set -g @theme-muted '#777777'
set -g @theme-fg '#e4e4e4'
set -g @theme-blue '#5e8de4'
set -g @theme-red '#e15344'
if-shell 'test -r ~/.local/state/darkman/tmux.conf' \
    'source-file ~/.local/state/darkman/tmux.conf'
source-file ~/.config/tmux/theme.conf
