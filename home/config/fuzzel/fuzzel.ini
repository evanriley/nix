[main]
include=~/.config/theme/fuzzel.ini

dpi-aware=no
exit-on-keyboard-focus-loss=no
hide-before-typing=no
horizontal-pad=40
icons-enabled=yes
image-size-ratio=0.5
inner-pad=20
keyboard-focus=exclusive
layer=overlay
letter-spacing=0
lines=15
match-counter=yes
match-mode=fuzzy
prompt="λ "
show-actions=no
sort-result=yes
tabs=8
terminal=foot -e
use-bold=no
vertical-pad=20
width=60

[border]
radius=0
width=1

[dmenu]
exit-immediately-if-empty=no
mode=text
[border]
width=2
radius=8
