name: update-flake-lock

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          # Not updated here: berkeley-mono (private, no CI access) and the
          # deliberately pinned helix, kak-*, friendly-snippets, monobiome and
          # lanzaboote.
          inputs: >-
            nixpkgs flake-parts import-tree home-manager agenix disko stylix nvf
            nixos-hardware nix-index-database git-hooks rust-overlay crane
          pr-title: "Update flake.lock"
          pr-labels: dependencies
