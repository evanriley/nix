name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The toplevel build substitutes a ~11 GiB closure; the preinstalled
      # Android, .NET and GHC SDKs would leave the runner too full for it.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      # The theme-switch VM test needs /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      # Daemon mode (default): pushes paths built in this job, which are all
      # stub-derived; substituted paths are not pushed.
      - uses: cachix/cachix-action@v17
        with:
          name: evanriley
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # CI cannot fetch the private berkeley-mono input; a public font stands in.
      - name: Stand in for berkeley-mono
        run: |
          stub="$RUNNER_TEMP/berkeley-mono"
          mkdir -p "$stub/fonts"
          fonts=$(nix build --no-link --print-out-paths nixpkgs#dejavu_fonts)
          cp "$fonts/share/fonts/truetype/DejaVuSansMono.ttf" "$stub/fonts/"
          echo "OVERRIDE_BERKELEY_MONO=path:$stub" >> "$GITHUB_ENV"

      # Evaluates every output and builds the checks. homeConfigurations are not
      # evaluated: they need the private manta input.
      - name: Flake check
        run: nix flake check -L --override-input berkeley-mono "$OVERRIDE_BERKELEY_MONO"

      # Builds cinderace's closure so local switches can substitute it from
      # the cache; substituted paths are not pushed. Ninetales cannot build
      # here (aarch64-darwin on x86_64-linux), so it is only evaluated.
      - name: Build cinderace toplevel
        run: nix build --no-link --override-input berkeley-mono "$OVERRIDE_BERKELEY_MONO" \
          .#nixosConfigurations.cinderace.config.system.build.toplevel

      - name: Evaluate every system
        run: |
          # Cinderace is built above; only ninetales needs evaluation here.
          for kind in darwinConfigurations; do
            for host in $(nix eval --raw ".#$kind" --apply 'c: toString (builtins.attrNames c)'); do
              echo "::group::$kind.$host"
              nix eval --raw --override-input berkeley-mono "$OVERRIDE_BERKELEY_MONO" \
                ".#$kind.$host.system.drvPath"
              echo
              echo "::endgroup::"
            done
          done
