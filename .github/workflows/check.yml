name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The theme-switch VM test needs /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      # CI cannot fetch the private berkeley-mono input; a public font stands in.
      - name: Stand in for berkeley-mono
        run: |
          stub="$RUNNER_TEMP/berkeley-mono"
          mkdir -p "$stub/fonts"
          fonts=$(nix build --no-link --print-out-paths nixpkgs#dejavu_fonts)
          cp "$fonts/share/fonts/truetype/DejaVuSansMono.ttf" "$stub/fonts/"
          echo "OVERRIDE_BERKELEY_MONO=path:$stub" >> "$GITHUB_ENV"

      # Evaluates every output and builds the checks. homeConfigurations are not
      # evaluated: they need the private manta input.
      - name: Flake check
        run: nix flake check -L --override-input berkeley-mono "$OVERRIDE_BERKELEY_MONO"

      - name: Evaluate every system
        run: |
          for kind in nixosConfigurations darwinConfigurations; do
            attr=config.system.build.toplevel
            [ "$kind" = darwinConfigurations ] && attr=system
            for host in $(nix eval --raw ".#$kind" --apply 'c: toString (builtins.attrNames c)'); do
              echo "::group::$kind.$host"
              nix eval --raw --override-input berkeley-mono "$OVERRIDE_BERKELEY_MONO" \
                ".#$kind.$host.$attr.drvPath"
              echo
              echo "::endgroup::"
            done
          done
