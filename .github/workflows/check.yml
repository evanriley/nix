name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The theme-switch VM test needs /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      # Evaluates every output and builds the checks. homeConfigurations are not
      # evaluated: they need the private berkeley-mono input.
      - name: Flake check
        run: nix flake check -L

      - name: Evaluate the cinderace system
        run: nix build --dry-run .#nixosConfigurations.cinderace.config.system.build.toplevel
