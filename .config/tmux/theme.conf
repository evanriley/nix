set -g status-style 'bg=#{@theme-bg-alt},fg=#{@theme-fg}'
set -g status-left-style 'bg=#{@theme-blue},fg=#{@theme-bg},bold'
set -g status-right-style 'fg=#{@theme-muted}'
setw -g window-status-style 'fg=#{@theme-muted}'
setw -g window-status-current-style 'bg=#{@theme-selection},fg=#{@theme-fg},bold'
setw -g window-status-activity-style 'fg=#{@theme-blue}'
setw -g window-status-bell-style 'fg=#{@theme-red},bold'
set -g pane-border-style 'fg=#{@theme-border}'
set -g pane-active-border-style 'fg=#{@theme-blue}'
setw -g mode-style 'bg=#{@theme-selection},fg=#{@theme-fg}'
set -g message-style 'bg=#{@theme-bg-alt},fg=#{@theme-fg}'
set -g message-command-style 'bg=#{@theme-bg-alt},fg=#{@theme-blue}'
set -gF display-panes-colour '#{@theme-muted}'
set -gF display-panes-active-colour '#{@theme-blue}'
set -g popup-style 'bg=#{@theme-bg},fg=#{@theme-fg}'
set -g popup-border-style 'fg=#{@theme-blue}'
