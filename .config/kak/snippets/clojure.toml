# Clojure snippets for simple-completion-language-server (friendly-snippets has none).
# The filename sets the scope; <tab> jumps between $1, $2, … and ends at $0.

[[snippets]]
prefix = "ns"
body = "(ns ${1:name}\n  (:require [${2:clojure.string} :as ${3:str}]))\n$0"
description = "namespace with a require"

[[snippets]]
prefix = "req"
body = "[${1:clojure.string} :as ${2:str}]"
description = "require entry"

[[snippets]]
prefix = "defn"
body = "(defn ${1:name}\n  \"${2:docstring}\"\n  [${3:args}]\n  $0)"
description = "function with docstring"

[[snippets]]
prefix = "defn-"
body = "(defn- ${1:name}\n  [${2:args}]\n  $0)"
description = "private function"

[[snippets]]
prefix = "fn"
body = "(fn [${1:args}] $0)"
description = "anonymous function"

[[snippets]]
prefix = "let"
body = "(let [${1:binding} ${2:value}]\n  $0)"
description = "let"

[[snippets]]
prefix = "if-let"
body = "(if-let [${1:binding} ${2:value}]\n  ${3:then}\n  ${4:else})"
description = "if-let"

[[snippets]]
prefix = "when-let"
body = "(when-let [${1:binding} ${2:value}]\n  $0)"
description = "when-let"

[[snippets]]
prefix = "cond"
body = "(cond\n  ${1:test} ${2:expr}\n  :else ${3:expr})"
description = "cond with :else"

[[snippets]]
prefix = "condp"
body = "(condp ${1:=} ${2:expr}\n  ${3:value} ${4:result}\n  ${5:default})"
description = "condp"

[[snippets]]
prefix = "case"
body = "(case ${1:expr}\n  ${2:value} ${3:result}\n  ${4:default})"
description = "case"

[[snippets]]
prefix = "doseq"
body = "(doseq [${1:x} ${2:xs}]\n  $0)"
description = "doseq"

[[snippets]]
prefix = "for"
body = "(for [${1:x} ${2:xs}]\n  $0)"
description = "for comprehension"

[[snippets]]
prefix = "loop"
body = "(loop [${1:binding} ${2:init}]\n  $0)"
description = "loop/recur"

[[snippets]]
prefix = "defmulti"
body = "(defmulti ${1:name} ${2:dispatch-fn})"
description = "multimethod"

[[snippets]]
prefix = "defmethod"
body = "(defmethod ${1:name} ${2:dispatch-value}\n  [${3:args}]\n  $0)"
description = "multimethod implementation"

[[snippets]]
prefix = "defprotocol"
body = "(defprotocol ${1:Name}\n  (${2:method} [${3:this}]))"
description = "protocol"

[[snippets]]
prefix = "defrecord"
body = "(defrecord ${1:Name} [${2:fields}])"
description = "record"

[[snippets]]
prefix = "try"
body = "(try\n  $1\n  (catch ${2:Exception} ${3:e}\n    $0))"
description = "try/catch"

[[snippets]]
prefix = "ex-info"
body = "(throw (ex-info \"${1:message}\" {${2::key value}}))"
description = "throw ex-info"

[[snippets]]
prefix = "comment"
body = "(comment\n  $0\n  ,)"
description = "rich comment block"

[[snippets]]
prefix = "deftest"
body = "(deftest ${1:name}-test\n  (testing \"${2:context}\"\n    (is (= ${3:expected} ${4:actual}))))"
description = "test with testing and is"

[[snippets]]
prefix = "testing"
body = "(testing \"${1:context}\"\n  $0)"
description = "testing"

[[snippets]]
prefix = "is"
body = "(is (= ${1:expected} ${2:actual}))"
description = "is ="

[[snippets]]
prefix = "tap"
body = "(tap> $0)"
description = "tap>"

[[snippets]]
prefix = "pp"
body = "(clojure.pprint/pprint $0)"
description = "pprint"
